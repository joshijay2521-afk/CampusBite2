[build]
  publish = "public"

# Replace YOUR-RENDER-SERVICE with the actual Render service hostname.
# Example: https://campusbite.onrender.com/api/:splat
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-RENDER-SERVICE.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
