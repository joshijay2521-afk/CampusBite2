[build]
  publish = "public"

# Replace YOUR-BACKEND-HOST with the exact Render or Railway backend hostname.
# Example: https://your-backend.example.com/api/:splat
[[redirects]]
  from = "/api/*"
  to = "https://YOUR-BACKEND-HOST/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
